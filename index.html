<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      height: fit-content;
    }

    h1 {
      font-size: 1.75rem;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    #todo-input {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    #todo-input:focus {
      border-color: #6366f1;
    }

    #add-btn {
      padding: 10px 18px;
      font-size: 1rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #add-btn:hover {
      background: #4f46e5;
    }

    #todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      margin-bottom: 10px;
      animation: slide-in 0.15s ease;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-text {
      font-size: 1rem;
      color: #374151;
      word-break: break-word;
      flex: 1;
      cursor: pointer;
      transition: color 0.2s, text-decoration-color 0.2s;
      user-select: none;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      text-decoration-color: #9ca3af;
      color: #9ca3af;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      margin-left: 12px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    .empty-state {
      text-align: center;
      color: #9ca3af;
      font-size: 0.95rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todo App</h1>
    <div class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a new todo..."
        maxlength="200"
        autocomplete="off"
      />
      <button id="add-btn">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <p class="empty-state" id="empty-state">No todos yet. Add one above!</p>
  </div>

  <script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');

    function updateEmptyState() {
      emptyState.style.display = list.children.length === 0 ? 'block' : 'none';
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.className = 'todo-item';

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = text;
      span.addEventListener('click', () => {
        li.classList.toggle('completed');
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.setAttribute('aria-label', 'Delete todo');
      deleteBtn.textContent = '✕';
      deleteBtn.addEventListener('click', () => {
        li.remove();
        updateEmptyState();
      });

      li.appendChild(span);
      li.appendChild(deleteBtn);
      list.appendChild(li);

      input.value = '';
      input.focus();
      updateEmptyState();
    }

    addBtn.addEventListener('click', addTodo);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    updateEmptyState();
  </script>
</body>
</html>
