<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist App</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-page: #f0f2f5;
      --bg-container: #ffffff;
      --bg-item: #f9fafb;
      --border-item: #e5e7eb;
      --border-input: #d1d5db;
      --text-heading: #1a1a2e;
      --text-body: #374151;
      --text-muted: #9ca3af;
      --shadow: rgba(0, 0, 0, 0.1);
      --toggle-bg: #e5e7eb;
      --toggle-color: #374151;
    }

    [data-theme="dark"] {
      --bg-page: #0f172a;
      --bg-container: #1e293b;
      --bg-item: #334155;
      --border-item: #475569;
      --border-input: #475569;
      --text-heading: #f1f5f9;
      --text-body: #e2e8f0;
      --text-muted: #94a3b8;
      --shadow: rgba(0, 0, 0, 0.4);
      --toggle-bg: #334155;
      --toggle-color: #f1f5f9;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-page);
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      min-height: 100vh;
      transition: background 0.2s;
    }

    .container {
      background: var(--bg-container);
      border-radius: 12px;
      box-shadow: 0 4px 20px var(--shadow);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      height: fit-content;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.75rem;
      color: var(--text-heading);
    }

    #theme-toggle {
      background: var(--toggle-bg);
      border: none;
      border-radius: 8px;
      color: var(--toggle-color);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 6px 10px;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }

    #theme-toggle:hover {
      background: var(--border-item);
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    #todo-input {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border: 2px solid var(--border-input);
      border-radius: 8px;
      outline: none;
      background: var(--bg-container);
      color: var(--text-body);
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }

    #todo-input:focus {
      border-color: #6366f1;
    }

    #todo-input::placeholder {
      color: var(--text-muted);
    }

    #add-btn {
      padding: 10px 18px;
      font-size: 1rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #add-btn:hover {
      background: #4f46e5;
    }

    #todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--bg-item);
      border: 1px solid var(--border-item);
      margin-bottom: 10px;
      animation: slide-in 0.15s ease;
      transition: background 0.2s, border-color 0.2s;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-text {
      font-size: 1rem;
      color: var(--text-body);
      word-break: break-word;
      flex: 1;
      cursor: pointer;
      transition: color 0.2s, text-decoration-color 0.2s;
      user-select: none;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      text-decoration-color: var(--text-muted);
      color: var(--text-muted);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      margin-left: 12px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Checklist App</h1>
      <button id="theme-toggle" aria-label="Toggle dark/light theme">🌙</button>
    </div>
    <div class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a new todo..."
        maxlength="200"
        autocomplete="off"
      />
      <button id="add-btn">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <p class="empty-state" id="empty-state">No todos yet. Add one above!</p>
  </div>

  <script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const themeToggle = document.getElementById('theme-toggle');

    // Theme persistence
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    function updateEmptyState() {
      emptyState.style.display = list.children.length === 0 ? 'block' : 'none';
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.className = 'todo-item';

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = text;
      span.addEventListener('click', () => {
        li.classList.toggle('completed');
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.setAttribute('aria-label', 'Delete todo');
      deleteBtn.textContent = '✕';
      deleteBtn.addEventListener('click', () => {
        li.remove();
        updateEmptyState();
      });

      li.appendChild(span);
      li.appendChild(deleteBtn);
      list.appendChild(li);

      input.value = '';
      input.focus();
      updateEmptyState();
    }

    addBtn.addEventListener('click', addTodo);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    updateEmptyState();
  </script>
</body>
</html>
